name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout min-api submodule
        run: git submodule update --init deps/min-api

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Collect macOS externals
        run: |
          mkdir -p dist
          cp -r externals/*.mxo dist/

      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: bbb.utils-macos
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout min-api submodule
        run: git submodule update --init deps/min-api

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Collect Windows externals
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path "externals\*.mxe64" -Destination "dist\" -Recurse

      - name: Upload externals
        uses: actions/upload-artifact@v4
        with:
          name: bbb.utils-windows
          path: dist/
